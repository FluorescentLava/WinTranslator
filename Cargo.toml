[package]
name = "translator"
version = "0.1.0-Beta"
edition = "2024"
rust-version = "1.95"
description = "Windows translation tool"
license = "MIT"
build = "build.rs"

[features]
portable = ["dep:windows-reactor-setup"]

[dependencies]
windows-reactor = "=0.100.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
md5 = "0.7"
html-escape = "0.2"
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
anyhow = "1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[build-dependencies]
windows-reactor-setup = { version = "=0.100.0", optional = true }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[patch.crates-io]
windows-reactor = { path = "vendor/windows-reactor" }
